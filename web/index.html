<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer Times Telegram Bot</title>
    <meta
      name="description"
      content="Search daily prayer times and continue with automatic reminders in Telegram."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Prayer Times Bot</p>
        <h1>Check today&apos;s prayer times and continue in Telegram.</h1>
        <p class="lede">
          This page is a quick preview. Automatic reminders are still delivered through the
          Telegram bot.
        </p>

        <form id="search-form" class="search-panel">
          <label class="label" for="city-query">City / Country</label>
          <div class="search-row">
            <input
              id="city-query"
              name="city"
              type="text"
              placeholder="Example: Jakarta, Indonesia"
              autocomplete="off"
            />
            <button type="submit">Search</button>
          </div>
          <p class="hint">Use a specific city format to get a more accurate result.</p>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="results" class="results"></div>
      </section>

      <section id="schedule-card" class="card hidden" aria-live="polite">
        <div class="card-head">
          <div>
            <p class="eyebrow">Today&apos;s Preview</p>
            <h2 id="schedule-title">-</h2>
          </div>
          <a id="telegram-link" class="telegram-link" href="#" target="_blank" rel="noreferrer">
            Open Bot
          </a>
        </div>

        <div class="meta">
          <span id="schedule-date">-</span>
          <span id="schedule-timezone">-</span>
        </div>

        <div id="timings" class="timings"></div>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
